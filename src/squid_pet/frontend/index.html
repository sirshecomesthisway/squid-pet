<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Squid</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }
    body.dragging { cursor: grabbing; }

    /* Wrapper rotates as a whole. All img-level animations (breathe,
       walk-bob, look-around) play INSIDE the rotated frame, so they
       compose with the rotation instead of fighting it. */
    .pet-wrapper {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      /* CRITICAL: pivot must match the pet sprite's center, NOT the window
         center. The sprite is centered at (100, 210) in a 200x300 window,
         so origin = 50% 70%. If this is 50% 50%, edge-rotation swings the
         sprite 60px sideways and the window clips the protruding edge.
         (Pink 2026-06-12.) */
      transform-origin: 50% 70%;
      transition: transform 0.6s ease-in-out;
      pointer-events: none;
    }

    .pet {
      position: absolute;
      /* Anchor sprite flush with window bottom (window 300px, sprite 180px,
         center at y=210 -> sprite top at y=120, bottom at y=300).
         The 80px of headroom is ALL above the sprite (for hearts), zero
         transparent buffer below. Reduces visible feet-to-Dock gap. */
      left: 50%; top: 210px;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: opacity 200ms ease;
      pointer-events: none;     /* let body capture mouse for drag */
    }
    /* Sprite swap fade. Pink-2026-09-01: this used to be a bare
       `opacity: 0`, removed 150ms later by a setTimeout -- which made her
       VISIBILITY depend on a JS timer firing. The comment on that timer
       already described the failure ("WKWebView is known to throttle/drop
       queued timers while occluded ... could strand swapping (opacity:0)
       indefinitely with no visible sprite"); the 2026-08-15 hardening cut
       two timers to one but kept the dependency. Confirmed live: she went
       fully invisible while the screen was covered, window healthy the
       whole time (CGWindowList: layer=25 alpha=1.0 onscreen=True), and
       only a restart brought her back.

       Now it is a finite animation that ENDS at opacity 1. With the
       default fill-mode the element reverts to its base style once the
       animation finishes -- and its base style is visible. A dropped
       timer, a throttled view, a stranded class: none of them can leave
       her invisible any more, because nothing has to run to restore her. */
    @keyframes sprite-swap-in { from { opacity: 0; } to { opacity: 1; } }
    .pet.swapping { animation: sprite-swap-in 220ms ease !important; }

    /* ─── Per-state animations ─── */
    @keyframes breathe { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.04);} }
    .pet[data-state="idle"] { animation: breathe 3s ease-in-out infinite; }

    /* Idle stretch-and-snap (Pink-2026-09-01): an occasional squash-and-
       stretch flourish so idle has a third beat alongside breathing and
       the look-around. She elongates upward, overshoots on the way back,
       then settles -- classic squash-and-stretch, which is what sells it
       as a body rather than a picture being scaled.

       transform-origin is her FEET, not her centre: she stands hugging a
       screen edge and the wrapper rotates her to match it, so "up" in her
       local frame is always away from whatever she's standing on. Growing
       from the centre would push her into the edge. Switching the origin
       is invisible because the animation both starts and ends at scale(1),
       where the pivot has no effect.

       !important matches the walk-bob/look-around idiom: it has to beat
       .pet[data-state="idle"]'s breathe. One-shot, and squishLoop() only
       arms it when no sub-state animation is running, so they never fight. */
    @keyframes idle-squish {
      0%   { transform: translate(-50%,-50%) scale(1, 1); }
      22%  { transform: translate(-50%,-50%) scale(0.90, 1.20); }
      45%  { transform: translate(-50%,-50%) scale(1.12, 0.88); }
      65%  { transform: translate(-50%,-50%) scale(0.96, 1.06); }
      82%  { transform: translate(-50%,-50%) scale(1.03, 0.98); }
      100% { transform: translate(-50%,-50%) scale(1, 1); }
    }
    .pet.squishing {
      transform-origin: bottom center;
      animation: idle-squish 900ms ease-in-out !important;
    }

    @keyframes thinking-tilt { 0%,100%{transform:translate(-50%,-50%) rotate(-4deg);} 50%{transform:translate(-50%,-50%) rotate(4deg);} }
    .pet[data-state="thinking"] { animation: thinking-tilt 2.4s ease-in-out infinite; }

    @keyframes working-shake { 0%,100%{transform:translate(-50%,-50%) translateX(0);} 25%{transform:translate(-50%,-50%) translateX(-1.5px);} 75%{transform:translate(-50%,-50%) translateX(1.5px);} }
    .pet[data-state="working"] { animation: working-shake 0.18s linear infinite; }

    @keyframes grooving-bounce { 0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(-5deg);} 25%{transform:translate(-50%,-50%) translateY(-10px) rotate(5deg);} 50%{transform:translate(-50%,-50%) translateY(0) rotate(-5deg);} 75%{transform:translate(-50%,-50%) translateY(-5px) rotate(5deg);} }
    .pet[data-state="grooving"] { animation: grooving-bounce 0.5s ease-in-out infinite; }

    @keyframes celebrating-jump { 0%{transform:translate(-50%,-50%) translateY(0) scale(1);} 20%{transform:translate(-50%,-50%) translateY(-18px) scale(1.08);} 40%{transform:translate(-50%,-50%) translateY(0) scale(1);} 60%{transform:translate(-50%,-50%) translateY(-10px) scale(1.04);} 80%,100%{transform:translate(-50%,-50%) translateY(0) scale(1);} }
    .pet[data-state="celebrating"] { animation: celebrating-jump 0.8s ease-out infinite; }

    @keyframes sleeping-breathe { 0%,100%{transform:translate(-50%,-50%) scale(0.94);} 50%{transform:translate(-50%,-50%) scale(1.02);} }
    .pet[data-state="sleeping"] { animation: sleeping-breathe 4.5s ease-in-out infinite; }

    @keyframes concerned-tremble { 0%,100%{transform:translate(-50%,-50%) translate(0,0);} 10%,30%,50%,70%,90%{transform:translate(-50%,-50%) translate(-1.5px,1.5px);} 20%,40%,60%,80%{transform:translate(-50%,-50%) translate(1.5px,-1.5px);} }
    .pet[data-state="concerned"] { animation: concerned-tremble 0.25s linear infinite; }

    /* ── APPROVAL-NEEDED ── agent waiting on user input. Big bouncy jump
       PLUS golden glow ring (drop-shadow follows alpha of idle.png so
       it hugs her silhouette, no ugly square box). Combined animation
       so jump and glow stay in phase. */
    /* attention_needed: gentle scale pulse synced to the flag-wave
       (4 frames * 150ms = 600ms loop). The flag-wave itself is driven
       by JS sprite swapping (startAttentionWave). No glow ring -- the
       flag carries the visual weight. Replaces the older bounce-glow. */
    @keyframes attention-pop {
      0%, 100% { transform: translate(-50%,-50%) scale(1.00); }
      50%      { transform: translate(-50%,-50%) scale(1.08); }
    }
    .pet[data-state="approval_needed"] {
      animation: attention-pop 0.6s ease-in-out infinite;
    }


    #hint {
      position: fixed; bottom: 4px; left: 50%;
      transform: translateX(-50%);
      background: rgba(40, 15, 60, 0.92); color: #f0c0e0;
      font: 10px/1.3 -apple-system, system-ui, sans-serif;
      padding: 4px 10px; border-radius: 10px;
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 400ms ease;
    }
    #hint.show { opacity: 1; }

    #debug {
      position: fixed; top: 2px; left: 4px;
      background: rgba(0,0,0,0.7); color: #f08899;
      font: 9px/1.2 monospace; padding: 2px 4px;
      border-radius: 3px; display: none; pointer-events: none;
    }
    body.debug #debug { display: block; }
  
    /* ─────── WALKING animation (when wandering) ─────── */
    /* Bob up-down + tiny tilt. Two variants: right-facing and left-facing.
       Both PRESERVE the centering translate(-50%, -50%) so the sprite stays
       in the middle of the window (otherwise she clips against the edge). */
    @keyframes walk-bob-right {
      0%   { transform: translate(-50%, -50%) translateY(0px)  rotate(-2deg); }
      25%  { transform: translate(-50%, -50%) translateY(-3px) rotate( 0deg); }
      50%  { transform: translate(-50%, -50%) translateY(0px)  rotate( 2deg); }
      75%  { transform: translate(-50%, -50%) translateY(-3px) rotate( 0deg); }
      100% { transform: translate(-50%, -50%) translateY(0px)  rotate(-2deg); }
    }
    @keyframes walk-bob-left {
      0%   { transform: translate(-50%, -50%) scaleX(-1) translateY(0px)  rotate(-2deg); }
      25%  { transform: translate(-50%, -50%) scaleX(-1) translateY(-3px) rotate( 0deg); }
      50%  { transform: translate(-50%, -50%) scaleX(-1) translateY(0px)  rotate( 2deg); }
      75%  { transform: translate(-50%, -50%) scaleX(-1) translateY(-3px) rotate( 0deg); }
      100% { transform: translate(-50%, -50%) scaleX(-1) translateY(0px)  rotate(-2deg); }
    }
    .pet[data-substate="walking-right"],
    .pet[data-substate="nudge-right"] {
      animation: walk-bob-right 0.45s ease-in-out infinite !important;
    }
    .pet[data-substate="walking-left"],
    .pet[data-substate="nudge-left"] {
      animation: walk-bob-left 0.45s ease-in-out infinite !important;
    }
  
    /* ─────── LOOK-AROUND: curious head-tilt animation ─────── */
    /* Slow back-and-forth tilt as if scanning the surroundings. */
    @keyframes look-around-right {
      0%   { transform: translate(-50%, -50%) rotate(0deg); }
      25%  { transform: translate(-50%, -50%) rotate(-14deg); }
      50%  { transform: translate(-50%, -50%) rotate(-14deg); }
      55%  { transform: translate(-50%, -50%) rotate(8deg); }
      80%  { transform: translate(-50%, -50%) rotate(14deg); }
      100% { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes look-around-left {
      0%   { transform: translate(-50%, -50%) scaleX(-1) rotate(0deg); }
      25%  { transform: translate(-50%, -50%) scaleX(-1) rotate(-14deg); }
      50%  { transform: translate(-50%, -50%) scaleX(-1) rotate(-14deg); }
      55%  { transform: translate(-50%, -50%) scaleX(-1) rotate(8deg); }
      80%  { transform: translate(-50%, -50%) scaleX(-1) rotate(14deg); }
      100% { transform: translate(-50%, -50%) scaleX(-1) rotate(0deg); }
    }
    .pet[data-substate="looking-around-right"] {
      animation: look-around-right 1.4s ease-in-out !important;
    }
    .pet[data-substate="looking-around-left"] {
      animation: look-around-left 1.4s ease-in-out !important;
    }

    /* ─────── TOOLTIP: explains why she's concerned ─────── */
    #concern-tooltip {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(40, 0, 0, 0.88);
      color: #ffd0d0;
      font: 600 11px -apple-system, sans-serif;
      padding: 5px 9px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 20;
    }
    #concern-tooltip.show { opacity: 1; }
    #concern-tooltip.transient {
      background: rgba(60, 50, 0, 0.85);
      color: #ffe9a8;
    }

    /* ============================================================
       Hearts-on-poke (spec: openspec/changes/hearts-on-poke)
       Ephemeral reaction effect: 3 hearts rise + fade on poke.
       Pointer-events: none so they NEVER block drags or clicks.
       ============================================================ */
    @keyframes heart-blink {
        0%   { transform: scale(0.3); opacity: 0; }
       10%  { transform: scale(1.4); opacity: 1; }
       20%  { transform: scale(1.0); opacity: 1; }
       40%  { transform: scale(1.15); opacity: 1; }
       55%  { transform: scale(1.0); opacity: 1; }
       80%  { transform: scale(1.0); opacity: 1; }
      100%  { transform: scale(0.9); opacity: 0; }
    }
    .heart {
      position: absolute;
      pointer-events: none;
      width: 38px;  /* pixel-art heart, aspect ~1.09:1 -> ~35px tall */
      height: 35px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      animation: heart-blink 1200ms ease-out forwards;
      z-index: 25;  /* above sprite, below tooltip */
    }

    /* ─────── OBSERVER speech bubble (observer-mode 2026-06-13) ─────── */
    /* Ephemeral one-line reaction shown above the sprite. Pointer-events
       off so user can drag/click through. Bubble does NOT participate in
       click-passthrough alpha mask (only sprite pixels do).               */
    /* ════════════════════════════════════════════════════════════════
       PIXEL-ART SPEECH BUBBLE (rebuilt 2026-06-13 per Pink's reference)
       Two render modes:
       (A) CSS-built default (no asset required): cream fill, dark
           maroon border, square corners, side notch shadows, staircase
           tail. Approximates Pink's reference closely.
       (B) PNG asset mode: drop a pixel-art bubble at
           frontend/assets/bubble.png and uncomment the .pixel-png class
           below + add class="pixel-png" to the #bubble div. Uses
           border-image 9-slice so corners stay crisp at any text width.
       ════════════════════════════════════════════════════════════════ */
    #bubble {
      position: fixed;
      /* Sprite head crown sits at ~60% from window bottom (sprite
         centered at y=210 in 300px window -> top at y=120 -> 60%).
         Bubble bottom at 62% leaves the tail tip ~6px above her head. */
      bottom: 62%;
      left: 50%;
      transform: translateX(-50%) scale(0.7);
      /* Cream fill matches reference; dark maroon border (warm near-black) */
      background: #ecead9;
      color: #1f1418;
      border: 3px solid #1f1418;
      border-radius: 0;                /* SQUARE corners = pixel art */
      padding: 6px 12px;
      /* Monospace gives the pixel/retro feel; system fonts so no
         external load and no corporate font-policy concerns */
      font: 12px/1.2 "SF Mono", Menlo, Monaco, "Courier New", monospace;
      font-weight: 600;
      /* Capped width + flexible height (2026-08-17 fix): was max-width
         with white-space:nowrap, which let long text overflow the box
         horizontally instead of wrapping -- since the pywebview window
         itself is only 200px wide (WINDOW_WIDTH/WIN_W across window.py/
         wanderer.py/passthrough.py), that overflow got clipped by the
         window's own edge, not just the bubble's border, so long
         reactions could render partially invisible. max-width (not a
         literal width) keeps short bubbles shrink-to-fit -- position:
         fixed + width:auto sizes to content by default -- while text
         past 150px content width (+24px padding +6px border +8px
         notch-shadow = ~188px visual span, comfortably inside the
         200px window with margin both sides) wraps and grows downward
         instead of sideways. */
      max-width: 150px;
      white-space: normal;
      overflow-wrap: break-word;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      /* Side notch shadows = the maroon outer-frame look from the
         reference (dark bars sticking out left/right of the cream). */
      box-shadow:
        4px 0 0 #1f1418,
        -4px 0 0 #1f1418,
        0 0 0 1px #1f1418;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      transition: none;  /* animations control visibility */
    }
    /* Staircase tail pointing DOWN-CENTER toward sprite.
       Built from a single ::after with stepped box-shadow stacks so it
       reads as 2 pixel "steps" merging into a point. */
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 6px;
      height: 6px;
      transform: translateX(-50%);
      background: #ecead9;
      border-left: 3px solid #1f1418;
      border-right: 3px solid #1f1418;
      border-bottom: 3px solid #1f1418;
      box-sizing: content-box;
    }
    /* Second smaller step under the first = staircase tip */
    #bubble::before {
      content: "";
      position: absolute;
      bottom: -12px;
      left: calc(50% - 3px);
      width: 0;
      height: 0;
      border-left: 3px solid #1f1418;
      border-right: 3px solid #1f1418;
      border-bottom: 3px solid #1f1418;
      border-top: 3px solid #ecead9;
      box-sizing: content-box;
    }

    /* ────────────────────────────────────────────────────────────────
       PNG asset mode -- uncomment when assets/bubble.png exists.
       Replace inner content rendering with the 9-slice border-image.
       --------------------------------------------------------------
    #bubble.pixel-png {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 14px 20px 22px 20px;
      border-image: url("assets/bubble.png") 32 24 48 24 fill / 16px 12px 24px 12px stretch;
    }
    #bubble.pixel-png::after,
    #bubble.pixel-png::before { display: none; }
       ──────────────────────────────────────────────────────────────── */

    @keyframes bubble-pop-in {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.7); }
      60%  { opacity: 1; transform: translateX(-50%) scale(1.08); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.0); }
    }
    @keyframes bubble-fade-out {
      0%   { opacity: 1; transform: translateX(-50%) scale(1.0); }
      100% { opacity: 0; transform: translateX(-50%) scale(0.85); }
    }
    #bubble.show-in  { animation: bubble-pop-in   150ms ease-out forwards; }
    #bubble.show-out { animation: bubble-fade-out 400ms ease-in  forwards; }

    /* ─── TOP-EDGE overrides: stacking = face → heart → bubble ─── */
    /* After 180° rotation the face lands at y≈245-275. Heart spawns
       at y≈235-270 (on the face). Bubble goes to the very bottom of
       the window (y≈267-300) so it sits BELOW the heart. Tail flips
       to point UP toward the face/heart above. */
    body[data-edge="top"] #bubble {
      bottom: 0;            /* flush with window bottom, below heart zone */
    }
    body[data-edge="top"] #bubble::after {
      bottom: auto;
      top: -6px;            /* tail step 1: above bubble body → points UP */
      border-bottom: none;
      border-top: 3px solid #1f1418;
    }
    body[data-edge="top"] #bubble::before {
      bottom: auto;
      top: -12px;           /* tail step 2: staircase tip pointing UP */
      border-bottom: none;
      border-top: 3px solid #ecead9;
      border-left: 3px solid #1f1418;
      border-right: 3px solid #1f1418;
    }
    /* Hint near top of window (near feet, out of the way) */
    body[data-edge="top"] #hint {
      bottom: auto;
      top: 4px;
    }

  </style>
</head>
<body>
  <div class="pet-wrapper" id="pet-wrapper">
      <img id="pet" class="pet" data-state="" src="" alt="Squid"/>
    </div>
  <div id="concern-tooltip"></div>
  <div id="hint"></div>
  <div id="bubble"><span></span></div>
  <div id="debug">state: <span id="d-state">?</span> · msg: <span id="d-message">?</span></div>

  <script>
    // ====== Hearts-on-poke (hoisted to module scope) ======
    // Tunable constants. Bump these to taste; spec captures defaults.
    const HEART_COUNT = 1;
    const HEART_X_JITTER_PX = 0;
    const HEART_Y_OFFSET_PX = 4;   // heart center just below sprite top; bottom edge hugs head crown
                                   // (Pink-2026-08-27l: halved from 8 -- tighter head-to-heart margin)
    const HEART_STAGGER_MS = 0;
    const HEART_MAX_LIVE = 12;
    function spawnHearts(centerX, centerY) {
      try {
        if (document.querySelectorAll('.heart').length >= HEART_MAX_LIVE) return;
        const container = document.body;
        const msg = `[squid] spawnHearts at (${centerX.toFixed(0)}, ${centerY.toFixed(0)})  viewport=${window.innerWidth}x${window.innerHeight}`;
        console.log(msg);
        try { window.pywebview?.api?.debug_log?.(msg); } catch(_){}
        for (let i = 0; i < HEART_COUNT; i++) {
          const h = document.createElement('img');
          h.className = 'heart';
          h.src = 'sprites/heart.png';
          h.alt = '';
          const jitter = (Math.random() * 2 - 1) * HEART_X_JITTER_PX;
          h.style.left = (centerX + jitter) + 'px';
          h.style.top = (centerY + HEART_Y_OFFSET_PX) + 'px';
          // Center on the (left, top) anchor: subtract half width / height
          h.style.marginLeft = '-19px';   // half of 38px
          h.style.marginTop = (_currentEdge === "top") ? '0px' : '-17px';
          h.style.animationDelay = (i * HEART_STAGGER_MS) + 'ms';
          h.addEventListener('animationend', () => h.remove(), { once: true });
          container.appendChild(h);
        }
      } catch (err) {
        const emsg = `[squid] spawnHearts ERROR: ${err.message}`;
        console.error(emsg, err);
        try { window.pywebview?.api?.debug_log?.(emsg); } catch(_){}
      }
    }
    // ====== end hoisted hearts ======

    const STATES = ["idle", "thinking", "working", "grooving",
                    "celebrating", "sleeping", "concerned"];

    const pet     = document.getElementById("pet");
    const dbgState= document.getElementById("d-state");
    const dbgMessage = document.getElementById("d-message");
    const hint    = document.getElementById("hint");

    let currentState = "";
    let pollTimer = null;
    let isDragging = false;
    let dragStartScreen = { x: 0, y: 0 };
    let lastMoveScreen  = { x: 0, y: 0 };
    let dragMovedPx     = 0;        // total movement during drag
    let clickStartTime  = 0;

    function spriteUrl(state) {
      // Backend sends arbitrary classifier states (thinking, working,
      // approval_needed, etc.). Most don't have matching PNGs -- only
      // a small allowlist does. Anything unknown falls back to idle.png
      // (Pink's lock: visible sprite is always idle unless mood layer
      // owns it). Pre-existing bug: backend state "approval_needed"
      // would 404 on sprites/approval_needed.png and show macOS's
      // broken-image placeholder.
      // All backend states that have a matching PNG in sprites/.
      // 2026-06-29: expanded from idle-only to include the full mood
      // set. Pink confirmed she never approved the previous "lock to
      // idle.png" behavior -- that was a past agent's unilateral call
      // mis-attributed to her in a code comment.
      const VALID = new Set([
        "idle","thinking","working","grooving","celebrating","concerned",
        "drowsy","stretch","sleeping","look-left","look-right","heart","blink",
        "attention_needed",
      ]);
      // approval_needed (backend) -> attention_needed (sprite). Same
      // moment, different visual identity. Frame cycling owned by
      // startAttentionWave(); this static is the fallback if cycling
      // somehow doesn't run.
      if (state === "approval_needed") return `sprites/attention_needed.png`;
      return VALID.has(state) ? `sprites/${state}.png` : `sprites/idle.png`;
    }

    // When the swap class was last armed, so poll() can sweep a stale one.
    // Belt and braces: the animation already ends visible, this just stops
    // a stranded class from freezing her state animation too.
    let _swapClassSince = 0;

    function setState(state, force = false) {
      if (!state) return;
      // 2026-06-29: restored real per-state sprite swapping. The
      // previous version locked the visible sprite to idle.png for
      // ALL backend states -- that was a past agent's call mis-attributed
      // to Pink in a since-deleted "Pink's lock" comment. She has 15
      // sprites and wants them used.
      const prevState = currentState;
      pet.dataset.state = state;       // raw state attribute for CSS animations
      currentState = state;
      dbgState.textContent = state;
      // Attention-needed flag-wave cycler: start on enter, stop on leave.
      // Runs in parallel with normal sprite swap below; the cycler skips
      // its tick when mood/sub-state owns the sprite, so layering is safe.
      if (state === "approval_needed" && prevState !== "approval_needed") {
        startAttentionWave();
      } else if (state !== "approval_needed" && prevState === "approval_needed") {
        stopAttentionWave();
      }
      // Mood layer (drowsy/sleeping/stretch) owns the sprite when active.
      // Skip swap so we don't fight the mood layer's setSpriteSrcDirect calls.
      if (_mood === "drowsy" || _mood === "sleeping" || _mood === "stretch") return;
      // Sub-state animations (walk/look-around) own the sprite while active.
      // Skip swap; applySubState will restore the base sprite when sub clears.
      if (pet.dataset.substate) return;
      // Compute target sprite for this state (spriteUrl whitelists known PNGs,
      // falls back to idle.png for anything unmapped like "approval_needed").
      const targetSrc = spriteUrl(state);
      if (!force && state === prevState) return;             // no state change
      if (pet.src.endsWith(targetSrc.split("/").pop())) return;  // already showing this sprite
      // Single deterministic removal path (2026-08-15 hardening): the old
      // code raced pet.onload against a 600ms fallback timer, both trying
      // to remove "swapping". Overlapping setState() calls (routine/
      // wanderer sub-states fire independently of the 800ms backend poll)
      // could reassign pet.onload before the earlier image's load event
      // fired, silently dropping that removal -- and WKWebView is known to
      // throttle/drop queued timers while occluded (e.g. covered by
      // another fullscreen app), which could strand "swapping" (opacity:0
      // via CSS, line ~47) indefinitely with no visible sprite. The CSS
      // `transition: opacity 200ms ease` already drives the actual fade
      // declaratively, so JS only needs to toggle the class around the
      // src swap -- no onload dependency, no second timer.
      // Swap immediately -- the fade is now the CSS animation's job, so
      // nothing is hidden while we wait for a timer. The class is only
      // re-armed (remove -> reflow -> add) to restart the animation.
      pet.src = targetSrc;
      pet.classList.remove("swapping");
      void pet.offsetWidth;              // force reflow so the anim restarts
      pet.classList.add("swapping");
      _swapClassSince = Date.now();
      // Tidy-up only. If this never fires she is still visible: the
      // animation has already ended at opacity 1.
      setTimeout(() => {
        pet.classList.remove("swapping");
      }, 260);
    }

    // Apply walking/look-around sub-state (set by Python wanderer/pulse).
    // For look-around sub-states, ALSO swap the sprite so her eyes/pupils
    // actually shift to match the head-tilt direction. Suppressed entirely
    // while she's in drowsy mood (she should stay drowsy, not turn her head).
    function applySubState(sub) {
      sub = sub || "";
      const isNudge = sub.startsWith("nudge-");
      if (!isNudge && (_mood === "drowsy" || _mood === "sleeping" || _mood === "stretch")) {
        // Suppress AMBIENT sub-state animations (wander walk/look-around)
        // while drowsy/sleeping/stretching -- she should stay resting, not
        // wander. Nudge hops are exempt (2026-08-19): a nudge is a direct
        // physical reaction to being bumped, not ambient wandering, and
        // should still visibly react even while asleep -- this suppression
        // was silently eating the walking-cue for nudge hops even though
        // the window itself was still physically moving.
        sub = "";
      }
      pet.dataset.substate = sub;
      const wrapper = document.getElementById("pet-wrapper");
      if (wrapper) wrapper.dataset.substate = sub;

      // Sprite swap based on sub-state. Instant (no fade).
      if (sub === "looking-around-left") {
        setSpriteSrcDirect("sprites/look-left.png");
      } else if (sub === "looking-around-right") {
        setSpriteSrcDirect("sprites/look-right.png");
      } else if (!_mood) {
        // No sub-state, no mood override -> restore base state sprite.
        setSpriteSrcDirect(spriteUrl(currentState));
      }
    }

    // ───── EDGE ROTATION: feet hug whichever screen edge she's on ─────
    // Backend's wanderer emits "edge" = "" | "bottom" | "left" | "right" | "top".
    // Rotate the sprite so feet point toward that edge (gecko-on-wall effect).
    let _currentEdge = "";
    // Top edge: shift sprite UP 80px to create room below the rotated
    // face for hearts + bubble. The 80px of headroom (y=0-120) absorbs
    // the shift; after rotation the face moves from y≈250 to y≈170,
    // freeing y≈205-300 for decorations.
    const TOP_EDGE_Y_SHIFT_PX = 80;

    // Build the pet-wrapper's CSS transform for a given rotation angle,
    // applying the top-pose headroom shift whenever deg normalizes to
    // 180 (the "top edge" pose -- upside down, head pointing toward
    // screen center). Shared by applyEdge (edge-based, discrete
    // 0/90/-90/180) and applyWrapperDeg (sprint's raw cumulative
    // degrees) so the two rotation paths can't silently diverge on when
    // the shift applies -- they already had once (Pink-2026-08-27e:
    // applyWrapperDeg was missing it entirely, so the sprint leg walking
    // the top edge didn't hug it the way normal edge-wandering did).
    function _wrapperTransformForDeg(deg) {
      const norm = ((deg % 360) + 360) % 360;
      const yShift = (norm === 180) ? `translateY(-${TOP_EDGE_Y_SHIFT_PX}px) ` : "";
      return `${yShift}rotate(${deg}deg)`;
    }

    function applyWrapperDeg(deg) {
      // Direct rotation override for sprint (cumulative degrees so CSS
      // always rotates CW, no shortest-path detours).
      const wrapperEl = document.getElementById("pet-wrapper");
      if (wrapperEl) wrapperEl.style.transform = _wrapperTransformForDeg(deg);
    }

    function applyEdge(edge) {
      edge = edge || "";
      if (edge === _currentEdge) return;
      _currentEdge = edge;
      let deg = 0;
      // CSS rotate(): positive = CW (top of sprite swings right),
      //                negative = CCW (top of sprite swings left).
      // We want HEAD (top of sprite) to point toward screen CENTER.
      if (edge === "left")   deg =  90;   // CW: head points RIGHT (toward center)
      if (edge === "right")  deg = -90;   // CCW: head points LEFT (toward center)
      if (edge === "top")    deg = 180;   // upside down: head points DOWN (toward center)
      // bottom or "" -> 0deg (default upright)
      // Rotate the WRAPPER, not the img. The img keeps its centering
      // transform and its CSS keyframe animations (breathe/walk-bob/etc.)
      // play freely INSIDE the rotated wrapper frame. No more fighting.
      const wrapperEl = document.getElementById("pet-wrapper");
      if (wrapperEl) wrapperEl.style.transform = _wrapperTransformForDeg(deg);
      pet.dataset.edge = edge;
      document.body.dataset.edge = edge;
      console.log(`[squid] edge -> ${edge || "(none)"} rotate ${deg}deg (wrapper)`);
    }

    // ─────── EXPRESSION LAYER: mood-driven sprite overrides ───────
    // Above the 7 base states (idle/thinking/working/...) sits a thin
    // expression layer that swaps the sprite for transient/mood reasons:
    //   - blink:    100ms swap to blink.png every ~7s while truly idle
    //   - drowsy:   sticky swap to drowsy.png after 60s of pure idle
    //   - stretch:  1.5s swap to stretch.png as the wake-up transition
    //   - look-around: already handled inline in applySubState
    // _mood tracks sticky overrides. Empty string = no override.
    let _mood = "";            // "" | "drowsy" | "sleeping" | "stretch"
    // Epoch ms until which a guaranteed drowsy beat holds before sleeping.
    // 0 in the natural path (drowsy->sleep is immediate at 315s); set only
    // when we blew past the drowsy window and forced a beat. See DROWSY_BEAT_MS.
    let _drowsyBeatUntil = 0;

    // Notify Python backend of mood transitions so RoutineController
    // can gate idle-rhythm ticks. Fire-and-forget; ignore errors.
    function notifyMoodToBackend(mood) {
      try {
        if (window.pywebview && window.pywebview.api &&
            window.pywebview.api.notify_mood) {
          window.pywebview.api.notify_mood(mood || "");
        }
      } catch (e) { /* silent */ }
    }
    let _lastWakeSeq = 0;     // tracks backend wake_trigger_seq
    let _blinkCooldownUntil = 0;
    // 2026-08-17: routine.py's IDLE_ROUTINE was briefly stretched ~2.2x
    // (per-action durations, not more actions) to avoid drowsy cutting
    // the cycle short -- but that made each individual walk/rest feel
    // sluggish, a worse experience than a snappy cycle. Reverted
    // IDLE_ROUTINE to its original ~91s-average pacing and instead
    // pushed these thresholds out to 300/360, so the SAME short cycle
    // gets to repeat 2-3+ times (300s / ~91s avg ~= 3.3 laps, and even
    // worst-case ~108.5s/lap still clears 2 full laps) before winding
    // down, rather than making one lap take longer. 60s drowsy->sleeping
    // gap preserved from the original 120/180 pair.
    const DROWSY_IDLE_SEC   = 300;   // 5 min idle -> drowsy mood
    const SLEEPING_IDLE_SEC = 315;   // 15s after drowsy -> sleeping. MUST equal
                                     // watcher.IDLE_THRESHOLD_SEC: past it the
                                     // backend reports "sleeping", and the mood
                                     // layer below blocks state-driven sprite
                                     // swaps -- a later mark here would strand
                                     // her on drowsy.png while state.json says
                                     // sleeping. Pinned by
                                     // tests/test_window_constants_agree.py.
    // Guaranteed drowsy beat (Pink-2026-09-07). The natural path shows
    // drowsy for the whole [300,315) window, but that window is skippable: a
    // wander lap covering it (sub_state set -> !trulyIdle) or idle resuming
    // already past 315s after a wake-hold both land her on the
    // >= SLEEPING_IDLE_SEC branch first, straight into sleeping with no yawn.
    // When that happens we hold her on drowsy.png for a full beat before
    // sleeping, so a recovered drowsy looks identical to a natural one --
    // hence derived from the window itself (SLEEPING - DROWSY = 15s), not a
    // separate magic number that could drift from it. See checkDrowsyState.
    const DROWSY_BEAT_MS    = (SLEEPING_IDLE_SEC - DROWSY_IDLE_SEC) * 1000;  // 15s
    const BLINK_MIN_SEC     = 6;
    const BLINK_MAX_SEC     = 9;
    const BLINK_DURATION_MS = 120;
    const STRETCH_DURATION_MS = 1500;
    // Idle squash-and-stretch. Much rarer than a blink (6-9s): a blink is
    // punctuation, a full-body stretch is a gesture, and a gesture on a
    // blink's cadence reads as a twitch.
    const SQUISH_MIN_SEC     = 24;
    const SQUISH_MAX_SEC     = 42;
    const SQUISH_DURATION_MS = 900;

    function setSpriteSrcDirect(src) {
      // Instant sprite swap, no fade. Used by expression/sub-state layers.
      if (pet.src.endsWith(src.split("/").pop())) return;  // already showing
      pet.src = src;
    }

    // ATTENTION-NEEDED FLAG WAVE
    // Backend state "approval_needed" triggers a 4-frame flag-wave cycle.
    // Sprite layer (this) handles the wave; CSS .pet[data-state="approval_needed"]
    // handles the synchronised scale pop. Combined cycle = 600ms (4 * 150ms).
    const ATTENTION_FRAMES = [
      "sprites/attention_needed_1.png",
      "sprites/attention_needed_2.png",
      "sprites/attention_needed_3.png",
      "sprites/attention_needed_4.png",
    ];
    const ATTENTION_FRAME_MS = 150;
    let _attentionTimer = null;
    let _attentionIdx = 0;

    function startAttentionWave() {
      if (_attentionTimer !== null) return;     // already running
      // attention_needed takes PRIME above all other rhythms (Pink's design).
      // Force-clear every override layer that could mask the wave:
      //   - mood (drowsy / sleeping / stretch)
      //   - sub-state (walking / looking-around)
      // Notify backend so the mood layer stays consistent with what's on screen.
      if (_mood === "drowsy" || _mood === "sleeping" || _mood === "stretch") {
        console.log(`[squid] attention_needed forcing wake from ${_mood}`);
        _mood = "";
        notifyMoodToBackend("");
      }
      if (pet.dataset.substate) {
        console.log(`[squid] attention_needed clearing sub-state ${pet.dataset.substate}`);
        pet.dataset.substate = "";
        const wrapper = document.getElementById("pet-wrapper");
        if (wrapper) wrapper.dataset.substate = "";
      }
      _attentionIdx = 0;
      setSpriteSrcDirect(ATTENTION_FRAMES[_attentionIdx]);
      _attentionTimer = setInterval(() => {
        // No deferrals. attention_needed is the highest-priority state.
        // If something else tried to swap the sprite mid-wave, we win
        // the next tick by swapping right back to the next frame.
        _attentionIdx = (_attentionIdx + 1) % ATTENTION_FRAMES.length;
        setSpriteSrcDirect(ATTENTION_FRAMES[_attentionIdx]);
      }, ATTENTION_FRAME_MS);
    }

    function stopAttentionWave() {
      if (_attentionTimer === null) return;
      clearInterval(_attentionTimer);
      _attentionTimer = null;
      _attentionIdx = 0;
    }

    function enterDrowsy() {
      if (_mood === "drowsy") return;
      _mood = "drowsy";
      notifyMoodToBackend("drowsy");
      setSpriteSrcDirect("sprites/drowsy.png");
      console.log("[squid] -> drowsy mood");
    }

    function enterSleeping() {
      if (_mood === "sleeping") return;
      _mood = "sleeping";
      notifyMoodToBackend("sleeping");
      setSpriteSrcDirect("sprites/sleeping.png");
      console.log("[squid] -> sleeping mood (3 min agent-idle)");
    }

    function wakeUpWithStretch() {
      // Wake from EITHER drowsy or sleeping mood. Always play stretch.
      if (_mood !== "drowsy" && _mood !== "sleeping") return;
      // Clear any forced-drowsy-beat deadline so it can't leak into the
      // next sleep cycle (Pink-2026-09-07).
      _drowsyBeatUntil = 0;
      const from = _mood;
      _mood = "stretch";
      notifyMoodToBackend("stretch");
      setSpriteSrcDirect("sprites/stretch.png");
      console.log(`[squid] -> stretch (waking from ${from})`);
      setTimeout(() => {
        _mood = "";
        notifyMoodToBackend("");
        // Restore the base sprite for whatever state she is in NOW -- with
        // one exception: never a sleeping one. Waking up cannot end on the
        // sprite you woke from.
        //
        // The old comment here claimed spriteUrl() "coerces to idle.png".
        // That stopped being true on 2026-06-29, when "sleeping" joined the
        // VALID set -- from then on this line restored sleeping.png, and the
        // wake transition ended by putting her straight back to sleep. Pink
        // caught it live on 2026-09-04.
        //
        // The backend now holds her awake too (watcher.py hold_awake_until),
        // so currentState is normally "idle" by the time this fires. The
        // guard stays because the two clocks are not synchronised: the
        // watcher recomputes every 1.0s and this poll loop runs every 800ms,
        // so a wake landing just after a watcher tick can be up to 1.8s from
        // a fresh state -- longer than the 1.5s stretch.
        const base = currentState === "sleeping" ? "idle" : currentState;
        setSpriteSrcDirect(spriteUrl(base));
        console.log(`[squid] stretch complete -> awake (base=${base})`);
      }, STRETCH_DURATION_MS);
    }

    function checkDrowsyState(result) {
      // Use agent_idle_seconds (time since the agent left "idle" state).
      // Pink wants her to nod off based on what the AGENT is doing, NOT
      // whether Pink is typing
      // in Slack/email/etc. macOS-wide idle is intentionally ignored.
      //
      // Sleep cycle (agent-idle based):
      //   0-300s       -> idle.png (mood="")
      //   300-315s     -> drowsy.png (mood="drowsy")
      //   315s+        -> sleeping.png (mood="sleeping")
      //   on agent wake -> stretch.png for 1.5s, then idle.png
      const state = result?.state || "idle";
      const idleSeconds = result?.agent_idle_seconds || 0;
      const subState = result?.sub_state || "";
      const isDragging = document.body.classList.contains("dragging");
      // 2026-09-04: "sleeping" counts here too. The backend now reports
      // sleeping off the same agent-idle clock (at SLEEPING_IDLE_SEC), so
      // gating on state === "idle" alone would freeze this machine at
      // drowsy the moment the backend crossed over -- and the mood layer
      // blocks state-driven sprite swaps, so she would sit on drowsy.png
      // for the rest of the quiet stretch.
      const trulyIdle = (state === "idle" || state === "sleeping")
                        && !subState && !isDragging;
      // user_wake_remaining > 0 = Pink poked / sprint-triggered recently.
      // User interaction takes prime over the agent-idle counter -> Squid
      // stays awake-faced even if the agent is silent.
      const userAwake = (result?.user_wake_remaining || 0) > 0;

      if (userAwake && (_mood === "drowsy" || _mood === "sleeping")) {
        // User just poked / sprinted while she was drowsy -> wake now,
        // hold idle until override expires.
        wakeUpWithStretch();
        return;
      }
      if (userAwake) {
        // Override active and she is awake -> hold idle, do NOT
        // re-enter drowsy/sleeping even if idleSeconds crosses thresholds.
        return;
      }

      if (trulyIdle && idleSeconds >= SLEEPING_IDLE_SEC) {
        // Past the sleep threshold. She must ALWAYS pass through drowsy
        // first (Pink-2026-09-07) -- never straight to sleeping.
        if (_mood === "sleeping") {
          // already asleep -- nothing to do
        } else if (_mood === "drowsy") {
          // Natural path (_drowsyBeatUntil === 0): sleep immediately at
          // 315s, so the 300->315 drowsy stretch is unchanged. Skip path:
          // hold on drowsy until the forced beat below has elapsed.
          if (Date.now() >= _drowsyBeatUntil) enterSleeping();
        } else {
          // Blew past the [300,315) drowsy window without ever going
          // drowsy -- a wander lap covered it, or idle resumed already
          // past 315 after a wake-hold. Force a visible drowsy beat first.
          enterDrowsy();
          _drowsyBeatUntil = Date.now() + DROWSY_BEAT_MS;
        }
      } else if (trulyIdle && idleSeconds >= DROWSY_IDLE_SEC && _mood !== "sleeping") {
        // 1-3 min: drowsy
        enterDrowsy();
      } else if ((_mood === "drowsy" || _mood === "sleeping") &&
                 (idleSeconds < DROWSY_IDLE_SEC || isDragging)) {
        // Wake trigger is SEMANTIC: real agent activity (agent-idle reset) or
        // user dragging only. Pulse/wanderer sub_state animations are NOT
        // wake signals - they're cosmetic, mood stays sticky through them.
        wakeUpWithStretch();
      }
    }

    function blinkLoop() {
      const interval = (BLINK_MIN_SEC + Math.random() * (BLINK_MAX_SEC - BLINK_MIN_SEC)) * 1000;
      setTimeout(() => {
        const now = Date.now();
        const canBlink = currentState === "idle"
                      && !pet.dataset.substate
                      && !_mood
                      && !document.body.classList.contains("dragging")
                      && now >= _blinkCooldownUntil;
        if (canBlink) {
          const restoreSrc = pet.src;
          setSpriteSrcDirect("sprites/blink.png");
          _blinkCooldownUntil = now + BLINK_DURATION_MS + 200;
          setTimeout(() => {
            // Only restore if nothing else swapped the sprite in the meantime.
            if (pet.src.endsWith("blink.png")) {
              setSpriteSrcDirect(restoreSrc);
            }
          }, BLINK_DURATION_MS);
        }
        blinkLoop();  // schedule next beat
      }, interval);
    }

    function squishLoop() {
      const interval = (SQUISH_MIN_SEC + Math.random() * (SQUISH_MAX_SEC - SQUISH_MIN_SEC)) * 1000;
      setTimeout(() => {
        // Same gate as blinkLoop: only while genuinely idle and unbothered.
        // Also skipped while a squish is already running, so a slow frame
        // can never stack two and double the scale.
        const canSquish = currentState === "idle"
                       && !pet.dataset.substate
                       && !_mood
                       && !document.body.classList.contains("dragging")
                       && !pet.classList.contains("squishing");
        if (canSquish) {
          pet.classList.add("squishing");
          setTimeout(() => {
            pet.classList.remove("squishing");
          }, SQUISH_DURATION_MS + 60);
        }
        squishLoop();  // schedule next beat
      }, interval);
    }

    function updateConcernTooltip(state, reason, severity) {
      const el = document.getElementById("concern-tooltip");
      if (!el) return;
      if (state === "concerned" && reason) {
        el.textContent = reason;
        el.classList.toggle("transient", severity === "transient");
        el.classList.add("show");
      } else {
        el.classList.remove("show");
      }
    }

    let _lastHintSeq = 0;

    // ─────── OBSERVER bubble (observer-mode 2026-06-13) ───────
    // State machine for the speech bubble:
    //   _bubbleText      -- text currently being displayed (or null if none)
    //   _bubbleHoldT     -- timeout id for the 2500ms "stay visible" phase
    //   _bubbleFadeT     -- timeout id for the 400ms fade-out animation
    //   _bubbleClearing  -- true while fade-out animation is playing
    //
    // Latest-wins: if a NEW non-null pending_bubble arrives while one is
    // already showing AND the text differs, we swap text and restart the
    // hold timer. If it MATCHES the current text, we no-op (backend hasn't
    // yet seen our clear_bubble() ack).
    let _bubbleText = null;
    let _bubbleHoldT = null;
    let _bubbleFadeT = null;
    let _bubbleClearing = false;

    function _ackBubbleToBackend() {
      try {
        if (window.pywebview?.api?.clear_bubble) {
          window.pywebview.api.clear_bubble().catch(() => {});
        }
      } catch (_) {}
    }

    function _hideBubble(el) {
      // Begin fade-out, then clear text + ack backend after animation
      el.classList.remove("show-in");
      void el.offsetWidth;  // restart animation
      el.classList.add("show-out");
      _bubbleClearing = true;
      _bubbleFadeT = setTimeout(() => {
        el.classList.remove("show-out");
        el.style.opacity = "0";
        const span = el.querySelector("span");
        if (span) span.textContent = "";
        _bubbleText = null;
        _bubbleClearing = false;
        _ackBubbleToBackend();
      }, 410);  // matches CSS bubble-fade-out duration (400ms) + 10ms slack
    }

    // Pink-2026-08-27: at the top edge, #bubble's CSS position was a
    // STATIC `bottom: 0` (flush with the literal window bottom) --
    // unlike spawnHearts(), which reads the sprite's real, live
    // getBoundingClientRect() (post rotate+translateY) to find her
    // actual face position. That static anchor doesn't track her real
    // rendered position (which also shifts with per-state animation
    // offsets, e.g. celebrating's jump), so the bubble could end up far
    // below the heart/face instead of just under it. Fix: mirror
    // spawnHearts' approach -- compute her live face Y and anchor the
    // bubble relative to THAT, only for the top edge (the default/other
    // edges' static CSS already tracks correctly and isn't touched).
    function _positionBubbleForEdge(el) {
      if (_currentEdge !== "top") {
        el.style.top = "";
        el.style.bottom = "";  // restore default CSS (bottom: 62%)
        return;
      }
      try {
        const sprite = document.getElementById('pet');
        if (!sprite) return;
        const r = sprite.getBoundingClientRect();
        // Same reference point spawnHearts uses for edge "top": the
        // bottom of the sprite's live bounding box IS her face after
        // the wrapper's rotate(180deg) + translateY(-80px). Stack
        // BELOW the heart zone (heart top = r.bottom + HEART_Y_OFFSET_PX,
        // heart is ~35px tall) with a small gap, matching the intended
        // face -> heart -> bubble order.
        const desiredTop = r.bottom + HEART_Y_OFFSET_PX + 35 + 6;
        // Pink-2026-08-27b: "text bubble could not show the fully
        // content when message is long". Root cause: the window is
        // only 300px tall and the sprite already sits flush with its
        // literal bottom edge (body has overflow:hidden -- no slack
        // past y=300). desiredTop leaves only ~80px below it, which
        // fits a single line but a 2nd wrapped line pushed the box
        // past y=300 and got clipped. Fix: measure the bubble's ACTUAL
        // rendered height (caller must set the text first) and pull
        // the anchor up so the whole box, wrapped or not, stays inside
        // the window instead of assuming single-line height.
        const margin = 4;
        const maxTop = window.innerHeight - el.offsetHeight - margin;
        el.style.bottom = "auto";
        el.style.top = Math.min(desiredTop, Math.max(maxTop, 0)) + "px";
      } catch (e) { /* leave whatever CSS/inline state is already set */ }
    }

    function _showBubble(el, text) {
      // Cancel any pending hide/fade
      if (_bubbleHoldT) { clearTimeout(_bubbleHoldT); _bubbleHoldT = null; }
      if (_bubbleFadeT) { clearTimeout(_bubbleFadeT); _bubbleFadeT = null; }
      _bubbleClearing = false;

      // Text must be set BEFORE positioning: _positionBubbleForEdge
      // (top edge) reads el.offsetHeight to clamp for wrapped multi-
      // line content, which only reflects reality once the span holds
      // the real text at the real max-width.
      const span = el.querySelector("span");
      if (span) span.textContent = text;
      _positionBubbleForEdge(el);
      el.style.opacity = "";  // let animation control it
      el.classList.remove("show-out");
      el.classList.remove("show-in");
      void el.offsetWidth;  // force reflow so animation re-fires
      el.classList.add("show-in");
      _bubbleText = text;

      // Hold for 2500ms then begin fade
      _bubbleHoldT = setTimeout(() => {
        _bubbleHoldT = null;
        _hideBubble(el);
      }, 2500);
    }

    function maybeShowBubble(text) {
      const el = document.getElementById("bubble");
      if (!el) return;
      if (!text) return;  // null/empty = no new bubble; existing one keeps its lifecycle

      // Latest-wins: if NEW text differs from current, swap immediately
      if (text !== _bubbleText) {
        _showBubble(el, text);
      }
      // If text == _bubbleText, backend hasn't seen our ack yet -- no-op
      // and let the in-flight ack land on next tick.
    }

    function maybeShowApiHint(text, seq) {
      if (typeof seq !== "number" || seq === _lastHintSeq) return;
      _lastHintSeq = seq;
      if (text) showHint(text, 2200);
    }

    // Backup watchdog disarm. If pywebview's native on_loaded event
    // misses (a known cocoa swizzle race that produces ~40% hangs on
    // this machine), the JS-side signal_ready() call provides the
    // second path. Idempotent on the Python side.
    let _readySignaled = false;
    async function poll() {
      // Sweep a stranded swap class. The animation ending at opacity 1
      // already guarantees she stays visible, so this only recovers her
      // STATE animation (breathe/tilt), which the class would otherwise
      // keep overridden. Runs first so a wedged view heals on the very
      // first tick after timers resume.
      if (_swapClassSince && Date.now() - _swapClassSince > 1000) {
        pet.classList.remove("swapping");
        _swapClassSince = 0;
      }
      try {
        if (window.pywebview?.api?.get_state) {
          if (!_readySignaled && window.pywebview.api.signal_ready) {
            _readySignaled = true;
            window.pywebview.api.signal_ready().catch(() => {});
          }
          const result = await window.pywebview.api.get_state();
          setState(result?.state || "idle");
          applySubState(result?.sub_state || "");
          // PetState.message (backend's short per-state caption, e.g.
          // "🛠️ running shell") was computed every tick but never
          // read anywhere in the frontend -- surface it in the existing
          // Ctrl+D debug overlay (2026-08-17 fix) rather than adding new
          // always-on UI, since #bubble already owns the persistent
          // "what is she doing" visual and a second competing caption
          // would just clutter the normal view.
          if (dbgMessage) dbgMessage.textContent = result?.message || "";
        // Sprint fast-transition: speed up wrapper CSS rotation during sprint.
        const wrapperFast = result?.sprint_fast_transition === true;
        window._sprintActive = wrapperFast;  // drives poll cadence (see scheduleNextPoll)
        const wrapperEl0 = document.getElementById("pet-wrapper");
        if (wrapperEl0) {
          wrapperEl0.style.transition = wrapperFast
            ? "transform 0.20s ease-out"
            : "transform 0.6s ease-in-out";
        }

        // Wake trigger: when backend bumps wake_trigger_seq, force wake from drowsy/sleeping.
        const wakeSeq = result?.wake_trigger_seq || 0;
        if (wakeSeq > _lastWakeSeq) {
          _lastWakeSeq = wakeSeq;
          if (_mood === "drowsy" || _mood === "sleeping") {
            console.log("[squid] wake trigger fired -> stretch");
            wakeUpWithStretch();
          }
        }

        // Sprint can override the rotation deg directly (bypasses edge->deg
        // mapping so we can do continuous CW accumulation, no back-flip).
        if (typeof result?.wrapper_deg === "number") {
          applyWrapperDeg(result.wrapper_deg);
        } else {
          applyEdge(result?.edge || "");
        }
          checkDrowsyState(result);
          updateConcernTooltip(result?.state, result?.concern_reason, result?.concern_severity);
          maybeShowApiHint(result?.hint_text, result?.hint_seq);
          maybeShowBubble(result?.pending_bubble);
        }
      } catch (e) { console.warn("poll failed", e); }
    }

    // Idempotency guard (2026-08-17): boot can wire up TWO independent
    // callers of startPolling() -- the 'pywebviewready' event listener
    // AND a 500ms fallback timer (see boot sequence near the bottom of
    // this file), armed together whenever pywebview.api isn't ready yet
    // at parse time. If the event fires before the fallback timer, both
    // eventually call startPolling(). blinkLoop() below self-recurses
    // forever via setTimeout with no cancellation handle, so a second
    // call spawned a second permanent blink chain racing the first to
    // set pet.src -- doubled blink frequency and visual glitches. Same
    // dual-timer-racing-to-mutate-visual-state class of bug as the
    // sprite fade-in race fixed earlier.
    let _pollingStarted = false;
    function startPolling() {
      if (_pollingStarted) return;
      _pollingStarted = true;
      if (pollTimer) clearInterval(pollTimer);
      poll();
      // Dynamic poll cadence: fast (80ms) during sprint so wrapper_deg
      // updates land in time; slow (800ms) otherwise to save CPU.
      // Old fixed 800ms was why "some turns looked slow" - the rotation
      // change wasn't seen by frontend until the next poll, sometimes 800ms
      // later, causing CSS transition to start during the walk.
      function scheduleNextPoll() {
        const fast = window._sprintActive === true;
        pollTimer = setTimeout(async () => {
          await poll();
          scheduleNextPoll();
        }, fast ? 80 : 800);
      }
      scheduleNextPoll();
      blinkLoop();   // start the blink heartbeat
      squishLoop();  // ...and the idle stretch. Started here, inside the
                     // _pollingStarted guard, for the same reason blinkLoop
                     // is: both self-recurse via setTimeout with no
                     // cancellation handle, so a second startPolling() would
                     // spawn a second permanent chain racing the first.
    }

    function showHint(msg, ms = 2500) {
      hint.textContent = msg;
      hint.classList.add("show");
      clearTimeout(showHint._t);
      showHint._t = setTimeout(() => hint.classList.remove("show"), ms);
    }

    /* ─────── DRAG: JS only kicks off Python's native drag loop ───────
       The Python side polls NSEvent.mouseLocation at 60Hz and auto-ends
       when the OS sees the left mouse button released. No JS↔Python RPC
       backpressure, no lost-mouseup stalls. */
    let _pokeDownTime = 0;
    let _pokeDownX = 0;
    let _pokeDownY = 0;
    const POKE_MAX_MS = 250;     // click must complete this fast to be a poke
    const POKE_MAX_PX = 6;       // and move less than this many px

    document.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;  // left-click only
      _pokeDownTime = Date.now();
      _pokeDownX = e.screenX;
      _pokeDownY = e.screenY;
      document.body.classList.add("dragging");
      try { window.pywebview?.api?.drag_start?.(); } catch(_){}
    });

    // mouseup is now a backup only — Python auto-detects button release.
    // Also: if down->up was fast AND barely moved, treat as a POKE.
    document.addEventListener("mouseup", (e) => {
      document.body.classList.remove("dragging");
      try { window.pywebview?.api?.drag_end?.(); } catch(_){}
      // Poke detection
      const dt = Date.now() - _pokeDownTime;
      const dx = e.screenX - _pokeDownX;
      const dy = e.screenY - _pokeDownY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (e.button === 0 && dt < POKE_MAX_MS && dist < POKE_MAX_PX) {
        // Defer poke API call so a follow-up dblclick can cancel it.
        // Browser fires dblclick when 2 clicks happen within ~500ms.
        // Without this, "boop boop!" would poke AND cycle state (pin thinking).
        if (window._pokePending) {
          clearTimeout(window._pokePending);
          window._pokePending = null;
        }
window._pokePending = setTimeout(() => {
          window._pokePending = null;
          // Single click = wake only (no heart). Heart is the dblclick reward.
          try { window.pywebview?.api?.poke?.(); } catch(_){}
          console.log(`[squid] poke (single click - wake only)! dt=${dt}ms dist=${dist.toFixed(1)}px`);
        }, 260);  // > typical dblclick threshold but feels instant
      }
    });

    // Extra safety: if pointer leaves the window mid-drag, also fire drag_end
    // (Python will auto-end on OS button-up too, but this is a fast cleanup
    // path for the passthrough state).
    document.addEventListener("mouseleave", () => {
      document.body.classList.remove("dragging");
    });

    /* ─────── Right-click: show native context menu ─────── */
    document.addEventListener("contextmenu", async (e) => {
      e.preventDefault();
      isDragging = false;
      document.body.classList.remove("dragging");
      try {
        if (window.pywebview?.api?.show_context_menu) {
          await window.pywebview.api.show_context_menu();
        } else if (window.pywebview?.api?.next_corner) {
          // Fallback: old corner-cycle behavior if menu not available
          const corner = await window.pywebview.api.next_corner();
          showHint(`📍 ${corner}`, 1500);
        }
      } catch (err) { console.warn("corner snap failed", err); }
    });

    /* ─────── Double-click: LIKE (heart + wake) + ack wave + take me there ─────── */
document.addEventListener("dblclick", async (e) => {
      e.preventDefault();

      // Cancel any pending single-click poke -- dblclick wins and fires its own
      if (window._pokePending) {
        clearTimeout(window._pokePending);
        window._pokePending = null;
        console.log("[squid] cancelled pending poke (dblclick won)");
      }

      // Dblclick = LIKE gesture: spawn heart + wake (via poke)
      // Note: poke() ALSO sets 60s wake override, so a dblclick on drowsy
      // Squid wakes her AND shows a heart -- one gesture, both effects.
      try {
        if (window.pywebview?.api?.poke) {
          await window.pywebview.api.poke();
        }
        // Pink-2026-08-31: dblclick while she's waving the approval_needed
        // flag is an unambiguous "I saw you" -- calm the wave instead of
        // leaving it nagging. No-ops (backend checks state) at any other
        // time, so this doesn't change the plain poke+heart case below.
        // Bubble text comes back directly on the RPC response and is shown
        // right here, rather than left for the next ~800ms poll to pick up
        // from pending_bubble -- the watcher thread ticks independently
        // every ~1s and her natural next state (often "working") can
        // overwrite pending_bubble with its own bubble first, silently
        // swallowing this one.
        if (currentState === "approval_needed"
            && window.pywebview?.api?.acknowledge_approval) {
          const ack = await window.pywebview.api.acknowledge_approval();
          if (ack?.bubble) maybeShowBubble(ack.bubble);
          console.log("[squid] dblclick ACK (calmed approval wave)");
        }
        // Pink-2026-09-01: dblclick also takes you to the window behind
        // whatever she's showing -- working, thinking, waving, celebrating,
        // grooving. The backend answers "resting" for idle/drowsy/sleeping,
        // where there is nothing to open, so this is safe to call always
        // and the gesture stays a plain poke+heart there.
        try {
          if (window.pywebview?.api?.take_me_there) {
            const t = await window.pywebview.api.take_me_there();
            if (t?.status && t.status !== "resting") {
              console.log(`[squid] take_me_there(${t.state}) -> ${t.status}`);
            }
          }
        } catch (_) { /* never let this break the like gesture */ }

        const sprite = document.getElementById('pet');
        if (sprite) {
          const r = sprite.getBoundingClientRect();
          spawnHearts(r.left + r.width / 2,
                    _currentEdge === "top" ? r.bottom : r.top);
        }
        console.log("[squid] dblclick LIKE (heart + wake)");
      } catch (err) {
        const emsg = `[squid] dblclick handler ERROR: ${err.message}`;
        console.warn(emsg, err);
        try { window.pywebview?.api?.debug_log?.(emsg); } catch(_){}
      }
    });

    /* ─────── Esc: resume auto state ─────── */
    document.addEventListener("keydown", async (e) => {
      if (e.key === "Escape") {
        try {
          if (window.pywebview?.api?.clear_force) {
            await window.pywebview.api.clear_force();
          }
        } catch (err) {}
        showHint("▶ auto", 1200);
      }
      if (e.ctrlKey && e.key === "d") {
        document.body.classList.toggle("debug");
      }
    });

    /* ─────── Boot ─────── */
    setState("idle", true);
    if (window.pywebview?.api) {
      startPolling();
    } else {
      window.addEventListener("pywebviewready", startPolling);
      setTimeout(startPolling, 500);
    }
    setTimeout(() => showHint("drag • poke • R-click=menu • dbl-click=take me there", 3500), 1200);
  </script>
</body>
</html>
